<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#111719"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><meta name="description" content="An educational lunar outpost mission trainer."><title>Outpost Control · Mission Trainer</title></head>
<body class="in-lobby"><main id="app"><canvas id="game-canvas" aria-label="3D lunar outpost control desk"></canvas>
<section id="lobby" aria-label="Game lobby"><div class="lobby-copy"><p class="lobby-kicker">NOVA &amp; YOU / LUNAR TRAINING</p><h1>OUTPOST<br><span>CONTROL</span></h1><p id="lobby-subtitle">和 NOVA 一起，展開月球探險。</p><div class="lobby-actions"><button id="lobby-start" type="button">開始探險 <span>→</span></button><button id="lobby-replay" type="button">重看 NOVA 迎賓</button><button id="lobby-skip" type="button">跳過開場</button><button id="lobby-language" type="button">繁中 / EN</button></div><details class="sound-settings"><summary id="lobby-sound-label">聲音設定</summary><label><span id="label-music">背景音樂</span><input id="volume-music" type="range" min="0" max="100" value="55"></label><label><span id="label-effects">音效</span><input id="volume-effects" type="range" min="0" max="100" value="60"></label><label><span id="label-voice">NOVA 聲音</span><input id="volume-voice" type="range" min="0" max="100" value="70"></label><label><span id="label-motion">減少畫面動態</span><input id="reduce-motion" type="checkbox"></label></details></div><p class="lobby-footer" id="lobby-footer">一段關於照顧基地、觀察與合作的旅程</p></section>
<div id="coach" aria-live="polite"><span id="coach-copy"></span></div><div id="dialogue" aria-live="polite"><strong>NOVA</strong><span id="dialogue-copy"></span></div><button id="intro-skip" type="button" hidden>跳過介紹</button><div id="transition" aria-hidden="true"></div></main><script type="module" src="/src/main.ts"></script></body></html>
