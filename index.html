<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#111719"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><meta name="description" content="An educational lunar outpost mission trainer."><title>Outpost Control · Mission Trainer</title></head>
<body class="in-lobby"><main id="app"><canvas id="game-canvas" aria-label="3D lunar outpost control desk"></canvas>
<section id="lobby" aria-label="Game lobby"><div class="lobby-copy"><p class="lobby-kicker">NOVA &amp; YOU / LUNAR TRAINING</p><h1>OUTPOST<br><span>CONTROL</span></h1><p id="lobby-subtitle">和 NOVA 一起，展開月球探險。</p><p class="lobby-disclosure">Independent bilingual educational simulation · Not a NASA product, mission tool, or safety system.</p><div class="lobby-actions"><button id="lobby-start" type="button">開始任務 <span>→</span></button><button id="lobby-language" type="button">繁中 / EN</button><button id="lobby-sources" type="button">NASA 資料與限制</button><button id="lobby-settings" type="button">設定</button></div><details class="sound-settings"><summary id="lobby-sound-label">聲音與顯示</summary><label><span id="label-music">背景音樂</span><input id="volume-music" type="range" min="0" max="100" value="55"></label><label><span id="label-effects">音效</span><input id="volume-effects" type="range" min="0" max="100" value="60"></label><label><span id="label-voice">NOVA 聲音</span><input id="volume-voice" type="range" min="0" max="100" value="70"></label><label><span id="lobby-text-label">文字大小</span><select id="lobby-text-size" aria-label="文字大小"><option value="normal">一般</option><option value="large">大字</option><option value="xlarge">超大字</option></select></label><label><span id="label-motion">減少畫面動態</span><input id="reduce-motion" type="checkbox"></label></details><details class="lobby-help"><summary id="lobby-help-title">操作說明</summary><p id="lobby-help-copy">拖動基地棋子選址；拖動天線調整方向；點擊資料卡查看來源；選擇觀察分類並連接維修接口。單指拖曳操作，鍵盤方向鍵可調整天線。</p></details></div><p class="lobby-footer" id="lobby-footer">一個短任務：用資料作選擇，再看基地狀態如何改變。</p></section>
<div id="coach" aria-live="polite"><span id="coach-copy"></span></div><div id="dialogue" aria-live="polite"><strong>NOVA</strong><span id="dialogue-copy"></span></div><button id="intro-skip" type="button" hidden>跳過介紹</button><div id="transition" aria-hidden="true"></div></main><script type="module" src="/src/main.ts"></script></body></html>
